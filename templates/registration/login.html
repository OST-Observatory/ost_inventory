{% extends "base.html" %}
{% block title %}Log in — OST Inventory{% endblock %}
{% block content %}
<div class="login-shell">
  <article class="login-card">
    <h1>OST Inventory</h1>
    <p class="muted">Sign in with your institute account to search, loan, and confirm equipment.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label>Username {{ form.username }}</label>
      <label>Password {{ form.password }}</label>
      <button type="submit">Log in</button>
    </form>
  </article>
</div>
{% endblock %}
