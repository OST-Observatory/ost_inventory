<div
  class="item-host-picker"
  data-lookup-url="{% url 'inventory:item_host_lookup' %}"
  {% if exclude_pk %}data-exclude="{{ exclude_pk }}"{% endif %}
  {% if kind %}data-lookup-kind="{{ kind }}"{% endif %}
>
  <p class="toolbar">
    <input
      type="search"
      data-host-search
      placeholder="Name or #0012…"
      autocomplete="off"
      aria-label="{{ search_label|default:'Search host item' }}"
    >
    <button type="button" class="outline secondary" data-host-scan hidden>Scan label</button>
    <button type="button" class="outline secondary" data-host-scan-stop hidden>Stop camera</button>
  </p>
  <div class="stocktake-camera" data-host-camera data-hide-idle hidden>
    <video playsinline autoplay muted></video>
  </div>
  <p class="field-hint" data-host-scan-status hidden></p>
  <div class="item-host-results" hidden></div>
  {{ field }}
  {{ field.errors }}
  {% if new_name_field %}
  <input type="hidden" name="{{ new_name_field.html_name }}" value="{{ new_name_field.value|default:'' }}" data-new-container>
  {{ new_name_field.errors }}
  {% endif %}
</div>
