<div class="label-size-grid">
  {% for size in label_sizes %}
  <label class="label-size-option">
    <input type="radio" class="visually-hidden" name="label_size" value="{{ size.key }}" {% if size.key == selected_size %}checked{% endif %}>
    <span class="label-sil" aria-hidden="true">
      {% if size.layout == "cable" %}
        <span class="label-sil-flag"></span>
        <span class="label-sil-tab"></span>
      {% else %}
        <span class="label-sil-body label-sil-{{ size.key }}"></span>
      {% endif %}
    </span>
    <strong>{{ size.name }}</strong>
    <span class="muted">{{ size.hint }}</span>
  </label>
  {% endfor %}
</div>
