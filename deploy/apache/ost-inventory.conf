# Merge into the TLS vhost. Adjust ServerName, certificate paths, and the
# socket path. Media is intentionally NOT aliased: photos are served by Django
# after authentication (inventory.views.media.protected_media).
#
# Proxy the whole vhost to gunicorn with |http://localhost/ so PATH_INFO is
# unchanged (/inventory/, /login/, /i/, /l/, /admin/, /media/).
# Optional extra layer: mod_ratelimit or Fail2ban on /login/.

LimitRequestBody 8388608

Alias /static /opt/ost_inventory/staticfiles

<Directory /opt/ost_inventory/staticfiles>
    Options -Indexes
    Require all granted
</Directory>

# --- HTTP: redirect everything to HTTPS (place in the :80 vhost) ---
# <VirtualHost *:80>
#     ServerName inventory.example.edu
#     Redirect permanent / https://inventory.example.edu/
# </VirtualHost>

# --- HTTPS vhost ---
# <VirtualHost *:443>
#     ServerName inventory.example.edu
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/inventory.example.edu/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/inventory.example.edu/privkey.pem
#
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader unset X-Forwarded-For
#
#     ProxyPass /static !
#     ProxyPass / unix:/run/ost-inventory/gunicorn.sock|http://localhost/
#     ProxyPassReverse / unix:/run/ost-inventory/gunicorn.sock|http://localhost/
# </VirtualHost>
