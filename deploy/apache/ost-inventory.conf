# Enable with: a2enconf ost-inventory
# Adjust paths, ServerName, and TLS certificate paths to match the server.
#
# Media is intentionally NOT aliased: photos are served by Django after
# authentication (see inventory.views.media.protected_media).
# Optional extra layer: mod_ratelimit or Fail2ban on /inventory/login/.

LimitRequestBody 8388608

Alias /inventory/static /opt/ost_inventory/staticfiles

<Directory /opt/ost_inventory/staticfiles>
    Options -Indexes
    Require all granted
</Directory>

# --- HTTP: redirect everything to HTTPS (place in the :80 vhost) ---
# <VirtualHost *:80>
#     ServerName inventory.example.edu
#     Redirect permanent / https://inventory.example.edu/
# </VirtualHost>

# --- HTTPS vhost example ---
# <VirtualHost *:443>
#     ServerName inventory.example.edu
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/inventory.example.edu/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/inventory.example.edu/privkey.pem
#
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader unset X-Forwarded-For
#
#     ProxyPass /inventory/static !
#     ProxyPass /inventory unix:/run/ost-inventory/gunicorn.sock|http://localhost/inventory
#     ProxyPassReverse /inventory unix:/run/ost-inventory/gunicorn.sock|http://localhost/inventory
# </VirtualHost>
